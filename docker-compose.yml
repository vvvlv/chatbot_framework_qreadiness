version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qreadiness-postgres
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: qreadiness-litellm
    ports:
      - "4000:4000"
    command: ["--host", "0.0.0.0", "--port", "4000"]
    restart: unless-stopped

volumes:
  postgres_data:
